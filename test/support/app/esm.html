<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Tables ESM bundle</title>
    <script type="importmap">
        {
            "imports": {
                "@fr0st/core": "/assets/frost-core.esm.js",
                "@fr0st/query": "/assets/fquery.esm.js",
                "@fr0st/ui": "/assets/frost-ui.esm.js"
            }
        }
    </script>
</head>
<body>
    <table><thead><tr><th>Name</th></tr></thead><tbody><tr><td>ESM row</td></tr></tbody></table>
    <script type="module">
        import $ from '@fr0st/query';
        import * as UI from '@fr0st/ui';

        const minified = new URL(location.href).searchParams.has('minified');
        const { default: Table } = await import(minified ? '/assets/frost-ui-tables.esm.min.js' : '/assets/frost-ui-tables.esm.js');
        const node = document.querySelector('table');
        const table = Table.init(node);
        document.body.dataset.shared = String(table instanceof UI.BaseComponent && $(node).table() === table);
    </script>
</body>
</html>
