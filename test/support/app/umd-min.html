<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Tables minified UMD bundle</title>
</head>
<body>
    <table><thead><tr><th>Name</th></tr></thead><tbody><tr><td>UMD row</td></tr></tbody></table>
    <script src="/assets/frost-ui-bundle.js"></script>
    <script>const originalUI = UI; const originalAlert = UI.Alert;</script>
    <script src="/assets/frost-ui-tables.min.js"></script>
    <script>
        const node = fQuery.findOne('table');
        const table = UI.Table.init(node);
        fQuery.setDataset(document.body, 'shared', String(UI === originalUI && UI.Alert === originalAlert && fQuery(node).table() === table));
    </script>
</body>
</html>
