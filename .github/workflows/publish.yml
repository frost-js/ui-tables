name: Publish

on:
  release:
    types:
      - published

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error('Release tag must match the package version.');
          }
          JS

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Check Sass variables
        run: npm run lint:sass:unused

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Run browser tests
        run: npm run test:browser -- --project=chromium --workers=4

      - name: Verify generated bundles are current
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- dist)" ]; then
            git status --short --untracked-files=all -- dist
            echo "::error::Generated bundles must be current and tracked. Run npm run build and commit dist."
            exit 1
          fi

      - name: Validate package contents
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --provenance
